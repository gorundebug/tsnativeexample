name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: [24.19.0, 26]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check

  runtime-images:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make docker-build

  linux-runtime-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Coverage
        run: corepack pnpm test:coverage
      - name: Event-loop stress
        run: corepack pnpm test:event-loop-stress
      - name: Diagnostic reports and heap snapshots
        run: corepack pnpm test:diagnostics
      - name: Debug-only native-addon tooling
        run: |
          docker build --target native-debug -t tsnativeexample-native-debug:ci .
          docker run --rm tsnativeexample-native-debug:ci gdb --version

  kafka-native-sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      npm_config_build_from_source: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Rebuild the pinned Kafka addon with ASan and UBSan
        run: corepack pnpm rebuild @confluentinc/kafka-javascript
      - name: Load the instrumented native addon
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          node scripts/test-kafka-native-addon.mjs

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Record production dependency licenses
        run: mkdir -p .artifacts/security && corepack pnpm licenses list --prod --json > .artifacts/security/dependency-licenses.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: .artifacts/security/sbom.spdx.json
      - name: Enforce the high-severity vulnerability policy
        run: corepack pnpm audit --prod --audit-level high
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsnativeexample-supply-chain
          path: .artifacts/security
