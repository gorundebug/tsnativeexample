services:
  inventoryservice:
    image: tsnativeexample-native-debug:local
    build:
      target: native-debug
    command:
      - node
      - --inspect=0.0.0.0:2345
      - --abort-on-uncaught-exception
      - --enable-source-maps
      - --report-on-fatalerror
      - --report-on-signal
      - --report-signal=SIGUSR1
      - --report-directory=/workspace/.artifacts/node-diagnostics/inventoryservice
      - --diagnostic-dir=/workspace/.artifacts/node-diagnostics/inventoryservice
      - --import=./scripts/node-diagnostics.mjs
      - --import=tsx
      - src/inventory/main.ts
    environment:
      NODE_DIAGNOSTIC_DIR: /workspace/.artifacts/node-diagnostics/inventoryservice
    ports:
      - "2345:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      core:
        soft: -1
        hard: -1

