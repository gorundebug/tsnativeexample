services:
  redpanda:
    image: redpandadata/redpanda:v24.2.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    networks:
      - app_net

  inventoryservice:
    image: tsnativeexample-inventoryservice:latest
    build:
      context: .
      target: inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      NODE_DIAGNOSTIC_DIR: /tmp/node-diagnostics
      INVENTORY_SERVICE_HTTP_HOST: 0.0.0.0
      INVENTORY_SERVICE_HTTP_PORT: 9092
      INVENTORY_SERVICE_GRPC_HOST: 0.0.0.0
      INVENTORY_SERVICE_GRPC_PORT: 9202
      INVENTORY_SERVICE_RESPONSE_DELAY: ${INVENTORY_SERVICE_RESPONSE_DELAY:-0s}
    ports:
      - "9092:9092"
      - "9202:9202"
    networks:
      - app_net

  analyticsservice:
    image: tsnativeexample-analyticsservice:latest
    build:
      context: .
      target: analyticsservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      NODE_DIAGNOSTIC_DIR: /tmp/node-diagnostics
      ANALYTICS_SERVICE_HTTP_HOST: 0.0.0.0
      ANALYTICS_SERVICE_HTTP_PORT: 9093
      ORDER_EVENTS_BROKERS: redpanda:9092
      ORDER_PROCESSED_TOPIC: order-processed
      ORDER_PROCESSED_GROUP_ID: analytics-service
      ORDER_PROCESSED_ENABLED: "true"
    ports:
      - "9093:9093"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - app_net

  orderservice:
    image: tsnativeexample-orderservice:latest
    build:
      context: .
      target: orderservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      NODE_DIAGNOSTIC_DIR: /tmp/node-diagnostics
      ORDER_SERVICE_HTTP_HOST: 0.0.0.0
      ORDER_SERVICE_HTTP_PORT: 9091
      INVENTORY_SERVICE_API_ADDRESS: inventoryservice:9202
      INVENTORY_SERVICE_API_CONNECTIONS_COUNT: ${INVENTORY_SERVICE_API_CONNECTIONS_COUNT:-1}
      ORDER_SERVICE_REQUEST_TIMEOUT: ${ORDER_SERVICE_REQUEST_TIMEOUT:-5s}
      ORDER_SERVICE_SOFT_DEADLINE_MARGIN: ${ORDER_SERVICE_SOFT_DEADLINE_MARGIN:-1s}
      ORDER_EVENTS_BROKERS: redpanda:9092
      ORDER_PROCESSED_TOPIC: order-processed
      ORDER_PROCESSED_ENABLED: "true"
    ports:
      - "9091:9091"
    depends_on:
      inventoryservice:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
